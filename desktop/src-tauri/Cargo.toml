[package]
name = "clawtab"
version = "0.6.1"
edition = "2021"
default-run = "clawtab"
autobins = false

[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
type_complexity = "warn"
too_many_arguments = "warn"

[lib]
name = "clawtab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clawtab"
path = "src/main.rs"

[[bin]]
name = "cwtctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "cwttui"
path = "src/bin/tui.rs"

[[bin]]
name = "clawtab-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "clawtab-hook"
path = "src/bin/clawtab-hook.rs"

[[bin]]
name = "cwttui-sidebar"
path = "src/bin/sidebar.rs"

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-notification",
  "dep:tauri-build",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
cron = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
ratatui = "0.29"
crossterm = "0.28"
clawtab-protocol = { path = "../../protocol" }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
tokio-util = "0.7"
gethostname = "1"
base64 = "0.22"
sha2 = "0.10"
snow = "0.10"
crypto_box = "0.9"
ed25519-dalek = "2"
libc = "0.2"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
portable-pty = "0.8"
alacritty_terminal = "0.26"
parking_lot = "0.12"
rpassword = "7"
fs2 = "0.4"
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.6"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSError", "NSDate", "NSBundle"] }
objc2-user-notifications = { version = "0.2", features = [
  "UNUserNotificationCenter",
  "UNNotificationRequest",
  "UNNotificationContent",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "block2",
] }
block2 = "0.5"

[lints.rust]
warnings = "deny"
unused = "deny"

[profile.release]
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
tempfile = "3"
